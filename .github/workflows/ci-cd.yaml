name: CI-CD

on:
  push:
    branches: 
      - feature/*
      - master
    paths:
      - "app/**"
      - "Dockerfile"
      - ".github/workflows/ci-cd.yaml"

permissions:
  contents: write

env:
  REPOSITORY: matteotv/argocd-demo
  # ENV: {{ github.ref_name == 'master' && 'prod' || 'dev' }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve environment name and tag
        id: vars
        run: |
          if [ "${{ github.ref_name }}" = "master" ]; then
            echo "env_name=prod" >> "$GITHUB_OUTPUT"
          else
            echo "env_name=dev" >> "$GITHUB_OUTPUT"
          fi
          echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.REPOSITORY }}:${{ steps.vars.outputs.env_name }}-${{ steps.vars.outputs.short_sha }}

      - name: Update image tag in overlay manifests
        env:
          ENV_NAME: ${{ steps.vars.outputs.env_name }}
          NEW_TAG: ${{ steps.vars.outputs.env_name }}-${{ steps.vars.outputs.short_sha }}
        run: |
          set -e
          KUSTOM_FILE="manifests/overlays/${ENV_NAME}/kustomization.yaml"
          PATCH_FILE="manifests/overlays/${ENV_NAME}/env-patch.yaml"

          sed -i "s|newTag: .*|newTag: ${NEW_TAG}|" "$KUSTOM_FILE"
          sed -i "/name: VERSION/{n;s|value: .*|value: \"${NEW_TAG}\"|}" "$PATCH_FILE"

          echo "Updated $KUSTOM_FILE and $PATCH_FILE to ${NEW_TAG}"

      - name: Commit and push manifest update
        env:
          ENV_NAME: ${{ steps.vars.outputs.env_name }}
          NEW_TAG: ${{ steps.vars.outputs.env_name }}-${{ steps.vars.outputs.short_sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "manifests/overlays/${ENV_NAME}"
          git commit -m "chore(${ENV_NAME}): deploy image ${NEW_TAG}" || { echo "No changes to commit"; exit 0; }
          git push origin HEAD:${{ github.ref_name }}
