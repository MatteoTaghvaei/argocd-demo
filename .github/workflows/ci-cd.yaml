name: CI-CD

on:
  push:
    branches: 
      - feature/*
      - master
    paths:
      - "app/**"
      - "Dockerfile"
      - ".github/workflows/ci-cd.yaml"

permissions:
  contents: write

env:
  REPOSITORY: matteotv/argocd-demo

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set global environment variables
        run: |
          ENV_NAME="${{ github.ref_name == 'master' && 'prod' || 'dev' }}"
          DATE_STAMP="$(date +'%Y%m%d')"
          BUILD_NUM="${{ github.run_number }}"
          NEW_TAG="${ENV_NAME}-${DATE_STAMP}-${BUILD_NUM}"

          echo "ENV_NAME=${ENV_NAME}" >> $GITHUB_ENV
          echo "NEW_TAG=${NEW_TAG}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          
          tags: ${{ env.REPOSITORY }}:${{ env.NEW_TAG }}

      - name: Update image tag in overlay manifests
        run: |
          set -e
          KUSTOM_FILE="manifests/overlays/${ENV_NAME}/kustomization.yaml"
          PATCH_FILE="manifests/overlays/${ENV_NAME}/env-patch.yaml"

          sed -i "s|newTag: .*|newTag: ${NEW_TAG}|" "$KUSTOM_FILE"
          sed -i "/name: VERSION/{n;s|value: .*|value: \"${NEW_TAG}\"|}" "$PATCH_FILE"

          echo "Updated $KUSTOM_FILE and $PATCH_FILE to ${NEW_TAG}"

      - name: Commit and push manifest update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "manifests/overlays/${ENV_NAME}"
          git commit -m "chore(${ENV_NAME}): deploy image ${NEW_TAG}" || { echo "No changes to commit"; exit 0; }
          git push origin HEAD:${{ github.ref_name }}