apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demo-argocd-dev
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/MatteoTaghvaei/argocd-demo.git
    targetRevision: master
    path: manifests/overlays/dev

  destination:
    server: https://kubernetes.default.svc
    namespace: dev

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
